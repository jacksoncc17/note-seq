<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#12141a">
<title>Piano tutor</title>
<style>
  /* Dark, thumb-sized, no external assets: it has to work on a phone on a
     music stand, over a LAN, with no internet. */
  :root { --bg:#12141a; --card:#1b1e26; --line:#2a2f3a; --fg:#e8eaf0;
          --dim:#9aa3b2; --accent:#4c8dff; --good:#3fb950; --warn:#d29922;
          --bad:#f85149; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.5
         -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:12px 14px;
           border-bottom:1px solid var(--line); position:sticky; top:0;
           background:var(--bg); z-index:5; }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  #piece { color:var(--dim); font-size:13px; margin-left:auto; text-align:right; }
  main { padding:14px; display:flex; flex-direction:column; gap:14px;
         max-width:820px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:14px; }
  .label { color:var(--dim); font-size:12px; text-transform:uppercase;
           letter-spacing:.06em; margin-bottom:6px; }
  #question { font-size:20px; font-weight:600; min-height:28px; }
  #question .opts { display:block; color:var(--dim); font-weight:400;
                    font-size:16px; margin-top:6px; }
  .row { display:flex; gap:10px; }
  input[type=text] { flex:1; background:#0e1015; border:1px solid var(--line);
        color:var(--fg); border-radius:10px; padding:12px; font-size:16px;
        min-width:0; }
  button { border:1px solid var(--line); background:#222735; color:var(--fg);
           border-radius:10px; padding:12px 14px; font-size:15px; font-weight:600; }
  button:disabled { opacity:.45; }
  button.primary { background:var(--accent); border-color:var(--accent);
                   color:#fff; }
  #mic { width:100%; padding:22px; font-size:19px; margin-top:2px; }
  #mic.recording { background:var(--bad); border-color:var(--bad); color:#fff; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { border:1px solid var(--line); border-radius:999px; padding:8px 14px;
          font-size:14px; background:#1b1e26; color:var(--dim); }
  .chip.on { border-color:var(--accent); color:var(--fg); background:#20293d; }
  #heard { color:var(--dim); font-size:14px; min-height:20px; }
  #reply { white-space:pre-wrap; }
  .meta { color:var(--dim); font-size:12px; margin-top:8px;
          display:flex; gap:12px; flex-wrap:wrap; }
  .pill { border-radius:999px; padding:2px 8px; border:1px solid var(--line); }
  .pill.ok { color:var(--good); border-color:#1f4025; }
  .pill.bad { color:var(--bad); border-color:#4a1f1f; }
  #log { font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; color:var(--dim);
         max-height:130px; overflow:auto; white-space:pre-wrap; }
  #level { height:6px; background:#0e1015; border-radius:3px; overflow:hidden; }
  #level > i { display:block; height:100%; width:0%; background:var(--good); }
  .hint { color:var(--warn); font-size:13px; }
</style>
</head>
<body>
<header>
  <h1>Piano tutor</h1>
  <span id="piece">connecting…</span>
</header>

<main>
  <div class="card" id="insecure" style="display:none;border-color:#4a3a12;background:#241f10">
    <div class="label" style="color:var(--warn)">Microphone needs a secure page</div>
    <div id="insecure-text"></div>
  </div>

  <div class="card">
    <div class="label">Question</div>
    <div id="question">—</div>
  </div>

  <div class="card">
    <button id="mic" class="primary">Hold to talk</button>
    <div id="level" style="margin-top:10px"><i></i></div>
    <div id="heard" style="margin-top:8px"></div>
    <div class="row" style="margin-top:10px">
      <input type="text" id="text" placeholder="…or type your answer"
             autocomplete="off" autocapitalize="off">
      <button id="send">Send</button>
    </div>
  </div>

  <div class="card">
    <div class="label">Tutor</div>
    <div id="reply">Say “drill me” to start, or ask about a bar.</div>
    <div class="meta">
      <span class="pill" id="m-mode">mode —</span>
      <span class="pill" id="m-ground">grounded —</span>
      <span class="pill" id="m-lat">—</span>
    </div>
  </div>

  <div class="card">
    <div class="label">Mode</div>
    <div class="chips" id="modes">
      <span class="chip" data-mode="drill">drill</span>
      <span class="chip" data-mode="listen_coach">listen &amp; coach</span>
      <span class="chip" data-mode="teach">teach</span>
      <span class="chip" data-mode="converse">converse</span>
    </div>
    <div class="chips" style="margin-top:10px">
      <span class="chip" id="c-map">show map</span>
      <span class="chip" id="c-status">progress</span>
      <span class="chip" id="c-repeat">repeat that</span>
    </div>
    <div class="hint" id="mic-warning" style="display:none;margin-top:10px"></div>
  </div>

  <div class="card">
    <div class="label">Log</div>
    <div id="log"></div>
  </div>
</main>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
let recorder = null, chunks = [], recording = false, audioCtx = null, analyser = null;
let rafId = null, busy = false;

function log(message) {
  const el = $("log");
  const stamp = new Date().toLocaleTimeString();
  el.textContent += `[${stamp}] ${message}\n`;
  el.scrollTop = el.scrollHeight;
}

function setPill(el, text, cls) {
  el.textContent = text;
  el.className = "pill" + (cls ? " " + cls : "");
}

async function api(path, options) {
  const response = await fetch(path, options);
  const text = await response.text();
  try { return JSON.parse(text); } catch (e) { return { error: text.slice(0, 200) }; }
}

function renderState(state) {
  if (!state) return;
  if (state.piece) {
    $("piece").textContent = `${state.piece.title || state.piece.slug}` +
      (state.piece.bars ? ` · ${state.piece.bars} bars` : "");
  }
  const pending = state.pending_question;
  $("question").innerHTML = pending
    ? `${escapeHtml(pending.prompt)}` +
      (pending.options ? `<span class="opts">${pending.options.map(escapeHtml).join(" · ")}</span>` : "")
    : "—";
  setPill($("m-mode"), "mode " + (state.mode || "—"));
  document.querySelectorAll("#modes .chip").forEach((chip) => {
    chip.classList.toggle("on", chip.dataset.mode === state.mode);
  });
  if (state.status) {
    const s = state.status;
    $("c-status").textContent =
      `progress ${s.correct || 0}/${s.attempts || 0}`;
  }
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function playAudio(b64) {
  if (!b64) return;
  const bytes = Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
  const url = URL.createObjectURL(new Blob([bytes], { type: "audio/wav" }));
  const audio = new Audio(url);
  audio.onended = () => URL.revokeObjectURL(url);
  audio.play().catch((e) => log("audio playback blocked: " + e.message));
}

function renderTurn(payload) {
  if (payload.error) { log("error: " + payload.error); return; }
  if (payload.transcript) $("heard").textContent = "heard: " + payload.transcript;
  else if (payload.skipped) $("heard").textContent = "(" + payload.skipped + ")";
  if (payload.reply) $("reply").textContent = payload.reply;
  setPill($("m-ground"), payload.grounded ? "grounded" : "UNGROUNDED",
          payload.grounded ? "ok" : "bad");
  if (payload.timings) {
    const t = payload.timings;
    setPill($("m-lat"), `${Math.round(t.total_ms)}ms (asr ${Math.round(t.asr_ms || 0)}ms)`);
  }
  if (payload.tools && payload.tools.length) {
    log("tools: " + payload.tools.map((t) => t.name).join(", "));
  }
  playAudio(payload.audio_wav_b64);
  renderState(payload.state);
}

async function send(text) {
  if (busy) return;
  busy = true;
  $("send").disabled = true;
  try {
    const payload = await api("/turn", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text }),
    });
    renderTurn(payload);
  } catch (e) {
    log("request failed: " + e.message);
  } finally {
    busy = false;
    $("send").disabled = false;
  }
}

async function sendAudio(blob) {
  if (busy) return;
  busy = true;
  $("send").disabled = true;
  $("heard").textContent = "transcribing…";
  try {
    const payload = await api("/turn", {
      method: "POST",
      headers: { "Content-Type": blob.type || "audio/webm" },
      body: blob,
    });
    renderTurn(payload);
  } catch (e) {
    log("upload failed: " + e.message);
  } finally {
    busy = false;
    $("send").disabled = false;
  }
}

async function startRecording() {
  if (recording || busy) return;
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 },
    });
  } catch (e) {
    // The usual cause on a phone is an insecure origin: plain http on a LAN IP.
    $("mic-warning").style.display = "block";
    $("mic-warning").textContent =
      "Microphone blocked (" + e.name + "). Browsers only allow it on https:// " +
      "or localhost — see the README for the adb reverse trick or a self-signed cert. " +
      "Typing still works.";
    log("getUserMedia failed: " + e.name);
    return;
  }
  const mime = MediaRecorder.isTypeSupported("audio/webm;codecs=opus")
    ? "audio/webm;codecs=opus"
    : (MediaRecorder.isTypeSupported("audio/mp4") ? "audio/mp4" : "");
  recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  chunks = [];
  recorder.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    stream.getTracks().forEach((t) => t.stop());
    if (analyser) { cancelAnimationFrame(rafId); analyser = null; $("level").firstElementChild.style.width = "0%"; }
    const blob = new Blob(chunks, { type: recorder.mimeType || "audio/webm" });
    log(`recorded ${(blob.size / 1024).toFixed(0)} KB (${recorder.mimeType})`);
    if (blob.size > 1200) sendAudio(blob);
    else { $("heard").textContent = "(too short)"; }
  };
  recorder.start();
  recording = true;
  $("mic").classList.add("recording");
  $("mic").textContent = "Recording — release to send";

  // A level meter: on a phone you cannot tell whether the mic is live.
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 1024;
    source.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    const tick = () => {
      if (!analyser) return;
      analyser.getByteTimeDomainData(data);
      let peak = 0;
      for (const v of data) peak = Math.max(peak, Math.abs(v - 128) / 128);
      $("level").firstElementChild.style.width = Math.min(100, peak * 220) + "%";
      rafId = requestAnimationFrame(tick);
    };
    tick();
  } catch (e) { log("level meter unavailable: " + e.message); }
}

function stopRecording() {
  if (!recording) return;
  recording = false;
  $("mic").classList.remove("recording");
  $("mic").textContent = "Hold to talk";
  try { recorder.stop(); } catch (e) { log("stop failed: " + e.message); }
}

async function refresh() {
  try {
    const state = await api("/state");
    if (state.error) return;
    renderState(state);
    $("piece").title = state.piece ? state.piece.slug : "";
  } catch (e) { /* server restarting */ }
}

async function boot() {
  // Warn before the user taps the mic, not only after it fails: browsers refuse
  // getUserMedia on a plain-http LAN origin, and a bare "microphone blocked"
  // looks like a broken app.
  const host = location.hostname;
  const isSecure = location.protocol === "https:" ||
                   ["localhost", "127.0.0.1", "::1"].includes(host);
  if (!isSecure) {
    $("insecure").style.display = "block";
    $("insecure-text").innerHTML =
      "Chrome allows the microphone only on <b>https://</b> or <b>localhost</b>. " +
      "Typing works right now; for the mic, pick one:<br><br>" +
      "<b>a) USB cable (easiest).</b> On the computer running the tutor:<br>" +
      "<code>adb reverse tcp:8080 tcp:8080</code><br>" +
      "then open <b>http://localhost:8080</b> here.<br><br>" +
      "<b>b) HTTPS.</b> Fetch the certificate from " +
      "<a href='/ca.pem' style='color:var(--accent)'>/ca.pem</a>, install it via " +
      "Settings &gt; Security &gt; Encryption &amp; credentials &gt; " +
      "Install a certificate &gt; CA certificate, then open " +
      "<b>https://" + host + ":8443</b>.";
  }
  const health = await api("/health");
  if (health.error) { log("server not responding: " + health.error); return; }
  log(`connected · asr=${health.asr} tts=${health.tts}`);
  await refresh();
  const started = await api("/start", { method: "POST" });
  renderTurn(started);
}

const micButton = $("mic");
micButton.addEventListener("pointerdown", (e) => { e.preventDefault(); startRecording(); });
micButton.addEventListener("pointerup", (e) => { e.preventDefault(); stopRecording(); });
micButton.addEventListener("pointercancel", stopRecording);
micButton.addEventListener("pointerleave", stopRecording);

$("send").addEventListener("click", () => {
  const value = $("text").value.trim();
  if (value) { $("text").value = ""; send(value); }
});
$("text").addEventListener("keydown", (e) => {
  if (e.key === "Enter") { e.preventDefault(); $("send").click(); }
});
document.querySelectorAll("#modes .chip").forEach((chip) => {
  chip.addEventListener("click", () => send("switch to " + chip.dataset.mode.replace("_", " ")));
});
$("c-map").addEventListener("click", () => send("what is the structure of this piece"));
$("c-status").addEventListener("click", () => send("how am I doing"));
$("c-repeat").addEventListener("click", () => send("say that again"));

setInterval(refresh, 15000);
boot();
</script>
</body>
</html>
