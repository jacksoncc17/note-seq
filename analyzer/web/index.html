<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12141a">
<title>Analyzer — practise</title>
<style>
  :root { color-scheme: dark; --bg:#12141a; --panel:#1b1f27; --line:#2c333d;
          --ink:#e8eef4; --dim:#93a1ae; --accent:#4da3ff; --sel:rgba(77,163,255,.28);
          --play:#e0a020; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--ink);
               font:16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
               -webkit-text-size-adjust:100%; }
  body { display:flex; flex-direction:column; }
  header, footer { background:var(--panel); border-color:var(--line); }
  header { border-bottom:1px solid var(--line); padding:8px 10px; }
  footer { border-top:1px solid var(--line); padding:8px 10px calc(8px + env(safe-area-inset-bottom)); }
  select, button { font:inherit; color:var(--ink); background:#232a34;
                   border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  button:active { background:#2e3742; }
  button[disabled] { opacity:.45; }
  #piece { width:100%; }
  .meta { color:var(--dim); font-size:13px; margin-top:6px; min-height:1.2em; }
  .warn { color:#ffcf7a; }
  main { flex:1; overflow:auto; -webkit-overflow-scrolling:touch; padding:8px 10px 4px; }
  .pagebar { display:flex; align-items:center; gap:10px; margin-bottom:6px; color:var(--dim);
             font-size:14px; }
  .pagebar button { padding:6px 14px; }
  #scorewrap { position:relative; width:100%; margin:0 auto; }
  #page { display:block; width:100%; height:auto; background:#fff; border-radius:6px; }
  #overlay { position:absolute; inset:0; }
  .bar { position:absolute; border:1px solid transparent; border-radius:4px;
         touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
  .bar.sel { background:var(--sel); border-color:var(--accent); }
  .bar.playing { border:2px solid var(--play); }
  .bar.pending { border:2px dashed var(--accent); }
  footer .row { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  #rangeline { flex:1; min-width:150px; font-variant-numeric:tabular-nums; }
  #rangeline b { color:var(--accent); }
  #play { background:#1d4e2a; border-color:#2f7a45; font-weight:600; }
  #play.on { background:#2f7a45; }
  .hint { color:var(--dim); font-size:12px; margin-top:6px; }
  #tracks { gap:6px; }
  .chip { padding:7px 11px; border-radius:999px; border:1px solid var(--line);
          background:#232a34; color:var(--ink); font-size:14px; }
  .chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent);
                               color:#0f1319; font-weight:600; }
  .chip .why { color:var(--dim); font-size:12px; margin-left:6px; }
  .chip[aria-pressed="true"] .why { color:#0f1319; }
  .big { font-size:17px; }
</style>
</head>
<body>
<header>
  <div class="row" style="display:flex;gap:8px">
    <select id="piece" aria-label="piece" style="flex:1"></select>
    <input id="search" type="search" placeholder="filter…" aria-label="filter pieces"
           style="flex:0 0 34%;min-width:96px;font:inherit;color:var(--ink);
                  background:#232a34;border:1px solid var(--line);border-radius:10px;padding:10px">
  </div>
  <div class="meta" id="meta">loading…</div>
</header>

<main>
  <div class="pagebar">
    <button id="prev" aria-label="previous page">‹</button>
    <span id="pagelabel">—</span>
    <button id="next" aria-label="next page">›</button>
    <span id="mode" style="margin-left:auto"></span>
  </div>
  <div id="scorewrap">
    <img id="page" alt="score page">
    <div id="overlay"></div>
  </div>
  <div class="hint" id="hint"></div>
</main>

<footer>
  <div class="row">
    <span id="rangeline" class="big">tap a bar to set the start</span>
    <button id="clear">clear</button>
  </div>
  <div class="row" id="tracks" style="margin-top:8px" role="group"
       aria-label="what to play"></div>
  <div class="row" style="margin-top:8px">
    <button id="play">▶ Play</button>
    <button id="stop">■ Stop</button>
    <label style="display:flex;align-items:center;gap:6px"><input type="checkbox" id="loop"> loop</label>
    <span id="clock" style="color:var(--dim);font-variant-numeric:tabular-nums"></span>
  </div>
  <audio id="player" preload="none"></audio>
</footer>

<script>
'use strict';

// Pre-roll and post-roll, matching the desktop app: starting exactly on the
// downbeat clips the piano's attack, stopping exactly on the barline cuts the
// final resonance.
const PRE_ROLL = 0.12, POST_ROLL = 0.25;

const $ = (id) => document.getElementById(id);
const state = { piece: null, detail: null, page: 1, from: null, to: null, playing: -1,
                track: 'recording', range: null };

// What each choice is, in words. The recording is the piece as played; the others are
// the score itself, which is the only thing that can be taken apart by hand.
const TRACKS = [
  { id: 'recording', label: '♪ Performance',
    why: 'the recording, mapped to the bars',
    title: 'the performance you aligned — rubato and all' },
  { id: 'both', label: 'Both hands', why: 'score',
    title: 'the score played back, both hands' },
  { id: 'left', label: 'Left hand', why: 'score',
    title: 'the lower staff alone — separated from the score, not from the recording' },
  { id: 'right', label: 'Right hand', why: 'score',
    title: 'the upper staff alone — separated from the score, not from the recording' },
];

async function api(path) {
  const response = await fetch(path, { cache: 'no-store' });
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.error || ('HTTP ' + response.status));
  return body;
}

function setMeta(text, warn) {
  const el = $('meta');
  el.textContent = text;
  el.className = warn ? 'meta warn' : 'meta';
}

// ---------------------------------------------------------------- piece list

async function loadPieces(options) {
  const opts = options || {};
  const select = $('piece');
  const previous = opts.keep ? select.value : null;
  const term = $('search').value.trim();
  const data = await api('/pieces' + (term ? '?q=' + encodeURIComponent(term) : ''));
  select.innerHTML = '';
  if (!data.pieces.length) {
    select.innerHTML = '<option value="">' + (term ? 'nothing matches' : 'no pieces found') + '</option>';
    setMeta(term ? 'no piece matches "' + term + '"'
                 : 'build one with memorization/analyze.py on the computer that runs this server',
            true);
    $('play').disabled = true;
    return;
  }
  for (const piece of data.pieces) {
    const option = document.createElement('option');
    option.value = piece.slug;
    option.textContent = piece.name + (piece.has_map ? '' : ' — no map');
    select.appendChild(option);
  }
  const wanted = previous || new URLSearchParams(location.search).get('piece');
  if (wanted && data.pieces.some((p) => p.slug === wanted)) select.value = wanted;
  await loadPiece(select.value);
  if (data.pieces.length > 1) {
    setMeta($('meta').textContent + ' · ' + data.pieces.length + ' pieces', false);
  }
}

let searchTimer = null;
$('search').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    loadPieces({ keep: true }).catch((e) => setMeta('could not filter: ' + e.message, true));
  }, 250);
});

async function loadPiece(slug) {
  if (!slug) return;
  state.piece = slug;
  stop();
  const detail = await api('/piece/' + encodeURIComponent(slug));
  state.detail = detail;
  state.range = null;
  pickTrack();
  renderTracks();

  const bits = [];
  if (detail.bars) bits.push(detail.bars + ' bars');
  if (detail.key) bits.push(detail.key);
  if (detail.map) {
    bits.push(detail.map.method + ' map, ' + detail.map.seconds_per_measure.toFixed(2) + ' s/bar');
  } else {
    bits.push('no measure map yet');
  }
  if (detail.duration_s) bits.push(Math.round(detail.duration_s) + ' s recording');
  setMeta(bits.join(' · ') + (detail.stale ? ' · ' + detail.stale : ''), !!detail.stale);

  const warnings = [];
  if (detail.map && detail.map.warnings) warnings.push(...detail.map.warnings);
  if (detail.score && detail.score.warnings) warnings.push(...detail.score.warnings);
  if (detail.notes) warnings.push(...detail.notes);
  $('hint').textContent = warnings.slice(0, 2).join(' ');

  try {
    const decks = await api('/decks/' + encodeURIComponent(slug));
    if (decks.decks && decks.decks.length) {
      const links = decks.decks.filter((d) => d.url).map((d) =>
        '<a href="' + d.url + '" style="color:var(--accent)">' + d.name + '</a>' +
        ' (' + Math.round(d.bytes / 1024) + ' KB)').join(' · ');
      $('hint').innerHTML = 'Anki: ' + (links || 'saved, not built yet') +
        '<br><span style="color:var(--dim)">open it in AnkiDroid to study and schedule</span>';
    }
  } catch (e) { /* a piece with no decks is the normal case */ }

  const pages = detail.score ? detail.score.pages : [];
  state.page = pages.length ? pages[0].number : 1;
  // A bookmark like ?piece=…&from=40&to=83 should open on the bar it names, not
  // on page one.
  if (state.from !== null) {
    const target = pages.find((p) => p.measures.some((b) => b.number === state.from));
    if (target) state.page = target.number;
  }
  showPage(state.page);
  updateRangeUI(pages);
  updatePlayButton();
}

// ------------------------------------------------------------------ drawing

function currentPage() {
  const pages = state.detail && state.detail.score ? state.detail.score.pages : [];
  return pages.find((p) => p.number === state.page) || null;
}

function showPage(number) {
  const pages = state.detail && state.detail.score ? state.detail.score.pages : [];
  if (!pages.length) {
    $('pagelabel').textContent = 'no engraved score';
    $('page').removeAttribute('src');
    $('overlay').innerHTML = '';
    return;
  }
  const page = pages.find((p) => p.number === number) || pages[0];
  state.page = page.number;
  $('page').src = '/score/' + encodeURIComponent(state.piece) + '/page-' + page.number + '.png';
  $('pagelabel').textContent = 'page ' + page.number + ' / ' + pages.length;

  // bars are positioned in percentages, so they stay correct at any screen width
  const overlay = $('overlay');
  overlay.innerHTML = '';
  for (const box of page.measures) {
    const div = document.createElement('div');
    div.className = 'bar';
    div.dataset.n = String(box.number);
    div.style.left = (100 * box.x0 / page.width) + '%';
    div.style.top = (100 * box.y0 / page.height) + '%';
    div.style.width = (100 * (box.x1 - box.x0) / page.width) + '%';
    div.style.height = (100 * (box.y1 - box.y0) / page.height) + '%';
    div.addEventListener('click', () => tapBar(box.number));
    overlay.appendChild(div);
  }
  paintHighlights();
}

function paintHighlights() {
  const page = currentPage();
  const overlay = $('overlay');
  if (!page) return;
  const low = state.from, high = state.to === null ? state.from : state.to;
  for (const div of overlay.children) {
    const n = Number(div.dataset.n);
    div.classList.toggle('sel', low !== null && n >= Math.min(low, high) && n <= Math.max(low, high));
    div.classList.toggle('playing', n === state.playing);
    div.classList.toggle('pending', state.to === null && n === state.from);
  }
  $('mode').textContent = (state.from === null) ? 'tap a bar to set the start'
                        : (state.to === null ? 'tap another bar to set the end'
                                             : 'tap a bar to start again');
}

// ------------------------------------------------------------------ selection

function tapBar(number) {
  if (state.from === null || (state.from !== null && state.to !== null)) {
    state.from = number; state.to = null;
  } else if (number === state.from) {
    state.to = number;                       // single-bar passage
  } else {
    state.to = number;
  }
  updateRangeUI();
  // Without this the Play button stayed disabled for ever unless the URL already
  // carried a range: it was only refreshed on load and on clear.
  updatePlayButton();
  writeUrl();
}

function updateRangeUI() {
  const line = $('rangeline');
  const readiness = trackReadiness();
  if (!readiness.ready) {
    // Say what is missing rather than leaving a dead button and no explanation.
    line.textContent = readiness.why;
    paintHighlights();
    return;
  }
  if (state.from === null) {
    line.textContent = 'tap a bar to set the start — or play the whole piece';
  } else if (state.to === null) {
    line.innerHTML = 'from bar <b>' + state.from + '</b> — tap the last bar';
  } else {
    const low = Math.min(state.from, state.to), high = Math.max(state.from, state.to);
    const isScore = state.track !== 'recording';
    const span = isScore ? spanForTrack(low, high) : spanFor(low, high);
    line.innerHTML = 'bars <b>' + low + '</b>–<b>' + high + '</b>' +
      (span ? ' · ' + span[0].toFixed(1) + '–' + span[1].toFixed(1) + ' s' : '');
  }
  paintHighlights();
}

// ------------------------------------------------------------------ tracks

// What this piece can actually play: the recording if one was fetched, and the score
// tracks its score allows. A single-staff piece offers no left or right hand, and the
// server says so rather than letting the button fail.
function offeredTracks() {
  const detail = state.detail;
  if (!detail) return [];
  const score = (detail.tracks && detail.tracks.tracks) || [];
  const ids = detail.has_audio ? ['recording'] : [];
  return ids.concat(score);
}

// Whether the chosen track can actually be played, and why not when it cannot.
function trackReadiness() {
  const detail = state.detail || {};
  if (state.track === 'recording') {
    if (!detail.has_audio) return { ready: false, why: 'no recording cached' };
    if (!detail.map) return { ready: false, why: 'no measure map' };
    return { ready: true };
  }
  if (!(detail.tracks && detail.tracks.tracks.includes(state.track))) {
    return { ready: false, why: (detail.tracks && detail.tracks.reason) || 'no score track' };
  }
  return { ready: true };
}

function pickTrack() {
  const offered = offeredTracks();
  if (!offered.length) return;
  if (offered.includes(state.track) && (state.chosen || trackReadiness().ready)) return;
  // Nothing chosen yet, or the remembered choice cannot play here. A recording that
  // was never aligned is a dead end, but the score tracks carry their own grid -- so
  // fall back to one of those rather than to a button that says "no map".
  if (trackReadiness().ready) return;
  state.track = offered.includes('both') ? 'both'
             : (offered.includes('recording') ? 'recording' : offered[0]);
}

function renderTracks() {
  const box = $('tracks');
  const offered = offeredTracks();
  const detail = state.detail || {};
  box.innerHTML = '';
  if (!offered.length) {
    const why = (detail.tracks && detail.tracks.reason) || 'no recording and no score to render';
    box.innerHTML = '<span style="color:var(--dim);font-size:13px">nothing to play: ' + why + '</span>';
    return;
  }
  for (const id of offered) {
    const spec = TRACKS.find((t) => t.id === id);
    if (!spec) continue;
    const chip = document.createElement('button');
    chip.className = 'chip';
    chip.setAttribute('aria-pressed', String(state.track === id));
    chip.title = spec.title;
    chip.innerHTML = spec.label + '<span class="why">' + spec.why + '</span>';
    chip.addEventListener('click', () => chooseTrack(id));
    box.appendChild(chip);
  }
}

function chooseTrack(id) {
  const wasPlaying = !!$('player').src && !$('player').paused;
  state.track = id;
  state.chosen = true;
  state.range = null;
  state.range = null;
  renderTracks();
  updateRangeUI();
  updatePlayButton();
  writeUrl();
  if (wasPlaying) play();               // switching hands mid-listen keeps it going
}

// The grid a score track is laid out on: one tempo throughout, so a bar's position is
// arithmetic. The same sum the server does when it turns bars into a slice.
function trackGrid() {
  const grid = state.detail && state.detail.tracks ? state.detail.tracks.grid : null;
  if (!grid || !grid.seconds_per_bar) return null;
  return { per: grid.seconds_per_bar, first: grid.first_bar || 1 };
}

function spanForTrack(low, high) {
  const grid = trackGrid();
  if (!grid) return null;
  const start = (low - grid.first) * grid.per;
  const end = (high - grid.first + 1) * grid.per;
  return [Math.max(0, start - PRE_ROLL), end + POST_ROLL];
}

function spanFor(low, high) {
  if (!state.detail || !state.detail.map) return null;
  const times = state.detail.map.measures;
  const find = (n) => times.find((m) => m.measure === n);
  const a = find(low), b = find(high);
  if (!a && !b) return null;
  const start = Math.min((a || b).start_s, (b || a).start_s);
  const end = Math.max((a || b).end_s, (b || a).end_s);
  return [start, end];
}

// ------------------------------------------------------------------ playback

function updatePlayButton() {
  const detail = state.detail;
  const button = $('play');
  if (!detail) { button.disabled = true; return; }
  pickTrack();
  const track = state.track;
  const isScore = track !== 'recording';
  // A recording has to have been aligned before its bars mean anything; a score track
  // brings its own grid with it, so it can be played from the moment it is rendered.
  const ready = isScore ? !!(detail.tracks && detail.tracks.tracks.includes(track))
                        : !!(detail.has_audio && detail.map);
  const chosen = state.from !== null;

  button.disabled = !ready;
  if (!ready) {
    button.textContent = isScore ? '▶ no score track' : (detail.has_audio ? '▶ no map' : '▶ no recording');
    button.title = isScore
      ? ((detail.tracks && detail.tracks.reason) || 'this piece cannot be rendered')
      : 'fetch and align a recording in the desktop app first';
  } else if (!chosen) {
    button.textContent = '▶ Whole piece';
    button.title = 'play all of it in ' + (isScore ? 'this score track' : 'the recording')
                 + ' — or tap a bar to practise a passage';
  } else {
    button.textContent = '▶ Play';
    button.title = 'play the bars you picked';
  }
  $('stop').disabled = !ready;
}

function play() {
  const player = $('player');
  const isScore = state.track !== 'recording';
  const whole = state.from === null;

  if (isScore) {
    // Bars, not seconds: the server slices a score track by its own grid, which is a
    // different tempo from the recording's map.
    const query = ['track=' + state.track];
    let range = null;
    if (!whole) {
      const low = Math.min(state.from, state.to === null ? state.from : state.to);
      const high = Math.max(state.from, state.to === null ? state.from : state.to);
      query.push('from_bar=' + low, 'to_bar=' + high);
      range = spanForTrack(low, high);
    }
    player.src = '/audio/' + encodeURIComponent(state.piece) + '?' + query.join('&');
    state.range = range || [0, null];        // the whole track: filled in on load
  } else {
    const query = ['track=recording'];
    let range = null;
    if (!whole) {
      const low = Math.min(state.from, state.to === null ? state.from : state.to);
      const high = Math.max(state.from, state.to === null ? state.from : state.to);
      const span = spanFor(low, high);
      if (!span) return;
      query.push('from=' + Math.max(0, span[0] - PRE_ROLL).toFixed(3),
                 'to=' + (span[1] + POST_ROLL).toFixed(3));
      range = [Math.max(0, span[0] - PRE_ROLL), span[1] + POST_ROLL];
    }
    player.src = '/audio/' + encodeURIComponent(state.piece) + '?' + query.join('&');
    state.range = range || [0, null];
  }
  player.loop = $('loop').checked;
  player.play().then(() => {
    $('play').classList.add('on');
    setMeta($('meta').textContent, false);
  }).catch((e) => setMeta('could not play: ' + e.message, true));
}

function stop() {
  const player = $('player');
  player.pause();
  player.removeAttribute('src');
  player.load();
  state.range = null;
  $('play').classList.remove('on');
  state.playing = -1;
  paintHighlights();
  $('clock').textContent = '';
}

function measureAtTime(seconds) {
  if (state.track !== 'recording') {
    // A score track runs at one tempo, so a bar is arithmetic rather than a lookup.
    const grid = trackGrid();
    const bars = state.detail ? state.detail.bars : 0;
    if (!grid) return -1;
    const bar = grid.first + Math.floor(seconds / grid.per);
    return (bar >= grid.first && bar <= (bars || bar)) ? bar : -1;
  }
  if (!state.detail || !state.detail.map) return -1;
  for (const m of state.detail.map.measures) {
    if (seconds >= m.start_s && seconds < m.end_s) return m.measure;
  }
  return -1;
}

$('player').addEventListener('loadedmetadata', () => {
  // The whole-piece case has no end time until the audio says how long it is.
  if (state.range && state.range[1] === null && isFinite($('player').duration)) {
    state.range[1] = $('player').duration;
  }
});

$('player').addEventListener('timeupdate', () => {
  const player = $('player');
  if (!state.range) return;
  const absolute = state.range[0] + player.currentTime;
  const found = measureAtTime(absolute);
  if (found !== state.playing) {
    state.playing = found;
    const page = currentPage();
    const onThisPage = page && page.measures.some((b) => b.number === found);
    if (found > 0 && !onThisPage) {
      const pages = state.detail.score.pages;
      const target = pages.find((p) => p.measures.some((b) => b.number === found));
      if (target) showPage(target.number);
    }
    paintHighlights();
  }
  const total = state.range[1] === null
    ? (isFinite(player.duration) ? player.duration : 0)
    : Math.max(0, state.range[1] - state.range[0]);
  $('clock').textContent = player.currentTime.toFixed(1) + ' / ' + total.toFixed(1) + ' s';
});

$('player').addEventListener('ended', () => {
  if (!$('loop').checked) {
    $('play').classList.remove('on');
    state.playing = -1;
    paintHighlights();
  }
});

// ------------------------------------------------------------------ URL state

function writeUrl() {
  const params = new URLSearchParams();
  params.set('piece', state.piece);
  if (state.from !== null) params.set('from', state.from);
  if (state.to !== null) params.set('to', state.to);
  if (state.track) params.set('track', state.track);
  history.replaceState(null, '', '?' + params.toString());
  try { localStorage.setItem('analyzer.track', state.track); } catch (e) {}
}

function readUrl() {
  const params = new URLSearchParams(location.search);
  const from = parseInt(params.get('from'), 10);
  const to = parseInt(params.get('to'), 10);
  if (!Number.isNaN(from)) state.from = from;
  if (!Number.isNaN(to)) state.to = to;
  let remembered = params.get('track');
  if (!remembered) {
    try { remembered = localStorage.getItem('analyzer.track'); } catch (e) {}
  }
  if (remembered && TRACKS.some((t) => t.id === remembered)) state.track = remembered;
}

// ------------------------------------------------------------------ wiring

$('piece').addEventListener('change', (e) => loadPiece(e.target.value));
$('prev').addEventListener('click', () => showPage(state.page - 1));
$('next').addEventListener('click', () => showPage(state.page + 1));
$('play').addEventListener('click', play);
$('stop').addEventListener('click', stop);
$('clear').addEventListener('click', () => {
  state.from = null; state.to = null; stop(); updateRangeUI(); writeUrl(); updatePlayButton();
});
$('loop').addEventListener('change', () => { $('player').loop = $('loop').checked; });

readUrl();
loadPieces().catch((e) => setMeta('could not load: ' + e.message, true));
</script>
</body>
</html>
