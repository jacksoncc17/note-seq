# Garage, containerised, for a machine that is not this one.
#
#   cp garage.toml.example garage.toml      # then replace the two secrets in it
#   docker compose up -d
#   ./bootstrap.sh                          # creates the layout, the key and the bucket
#
# The image is pinned: Garage's on-disk format has changed between minor versions, and an
# archive that a newer container cannot read is a worse failure than a missing update.
# Bump the tag deliberately, with `docker compose exec garage garage --version` to confirm.
services:
  garage:
    image: dxflrs/garage:v2.1.0
    container_name: garage
    restart: always
    # The S3 API only. The web UI (3902) and the admin API (3903) stay on the container's
    # network: the admin endpoint can create keys, and neither is needed by a client.
    ports:
      - "3900:3900"
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      # One volume for both metadata and data, so a backup is one thing to copy.
      - garage-data:/var/lib/garage
    healthcheck:
      # Exec form, because **this image has no shell** -- a `CMD-SHELL` check cannot run at
      # all, and the container reports `unhealthy` forever while answering requests
      # perfectly, which then fails `docker compose up --wait` on a deploy.
      #
      # `garage status` exits non-zero until the daemon answers on its RPC port, which is
      # what "up" means here; the S3 endpoint alone would pass while the node still has no
      # role assigned and refuses every write.
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 15s

  # A web UI for looking around, optional and never on by default:
  #
  #   GARAGE_ADMIN_TOKEN=$(grep -oP '(?<=^admin_token = ")[^"]+' garage.toml) \
  #     docker compose --profile ui up -d          # then http://<this host>:3909
  #   docker compose --profile ui down             # and it is gone
  #
  # `khairul169/garage-webui` is the Garage-native one: cluster health and layout, buckets
  # and their objects, access keys. It reads the admin token from `garage.toml`, which is
  # mounted read-only below; the token is *not* written into this file, because this file is
  # committed and garage.toml is not.
  #
  # It talks to the admin API over the compose network (`API_BASE_URL` below), so port 3903
  # stays unpublished -- and that matters: the admin API can create and delete keys, so this
  # container is the only thing that reaches it. The UI itself can delete the archive, so keep
  # it on the LAN (or behind Tailscale) rather than publishing 3909 to the internet.
  #
  # To require a login, set AUTH_USER_PASS (see the project's README: `htpasswd -nbBC 10`).
  webui:
    image: khairul169/garage-webui:latest
    container_name: garage-webui
    restart: unless-stopped
    profiles: ["ui"]
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
    environment:
      API_BASE_URL: http://garage:3903
      # Empty is fine when the mounted config is readable: the UI takes the token from it.
      API_ADMIN_KEY: ${GARAGE_ADMIN_TOKEN:-}
      S3_ENDPOINT_URL: http://garage:3900
      S3_REGION: garage
      AUTH_USER_PASS: ${GARAGE_UI_AUTH:-}
    ports:
      - "3909:3909"
    depends_on:
      garage:
        condition: service_healthy

volumes:
  garage-data:
